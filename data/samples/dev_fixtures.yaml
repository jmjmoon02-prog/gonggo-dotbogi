    job: { title: "상품 리뷰 체험단", duties_summary: "리뷰 작성", duty_clarity: vague }
    pay: { amount_text: "리뷰 1건당 2만 원", unit: per_task, amount_krw: 20000, quote: "리뷰 1건당 2만 원 지급" }
    contact: { channels: [sms, external_link, kakao_personal], moves_to_messenger: true, quote: "카카오톡 친구 추가 ID: [메신저ID1]" }
    value_flow:
      required_actions:
        - { item: "외부 사이트 회원가입", quote: "아래 링크에서 회원가입 후 시작하세요" }
      hiring_process: "문자 → 외부 링크 가입 → 카카오톡 친구 추가"
