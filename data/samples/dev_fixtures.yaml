      - { signal_id: M1, quote: "아래 링크에서 회원가입 후 시작하세요", explanation: "업무를 이유로 외부 사이트 가입을 유도합니다." }
      - { signal_id: S2, quote: "카카오톡 친구 추가", explanation: "개인 메신저로 이동을 유도합니다." }
    missing_info: ["쇼핑몰 공식 채용 페이지·대표번호", "운영 업체 사업자 정보"]

demo_vague_dm:
  round1:
    job: { title: "재택 부업", duty_clarity: vague }
    pay: { amount_text: "월 200 이상", unit: month, amount_krw: 2000000, quote: "월 200 이상 가능합니다" }
    contact: { channels: [instagram_dm] }
    signals:
      - { signal_id: S1, quote: "하루 1~2시간, 월 200 이상 가능합니다", explanation: "업무 설명 없이 짧은 시간에 높은 수입을 강조합니다." }
      - { signal_id: S3, quote: "재택 부업 관심 있으시면 연락 주세요", explanation: "무슨 일을 하는지 적혀 있지 않습니다." }
    axis_violations:
      - { axis: F, quote: "하루 1~2시간, 월 200 이상 가능합니다", explanation: "하루 1~2시간에 월 200만 원 이상은 업무에 비해 보상이 비정상적으로 큽니다." }
    missing_info: ["업체명", "업무 내용", "급여 지급 방식"]
    follow_up_questions:
      - "하루 1~2시간에 월 200만 원 이상이 가능한 업무가 구체적으로 무엇인가요?"
      - "급여는 누가, 어떤 계좌에서, 어떤 명목으로 보내 주시나요?"
  round2:
    job: { title: "구매대행 재택 부업", duties_summary: "상품 대신 구매 후 환급", duty_clarity: clear }
    pay: { amount_text: "월 200 이상", unit: month, amount_krw: 2000000, quote: "월 200 이상 가능합니다" }
    contact: { channels: [instagram_dm] }
    value_flow:
      worker_pays:
        - { item: "상품 대금(대신 구매)", quote: "쇼핑몰 상품을 대신 구매해 주시면" }
        - { item: "체크카드 사진", quote: "먼저 체크카드 앞면 사진 보내 주세요" }
      worker_receives: [{ item: "원금+수익 15% 환급 약속", quote: "원금+수익 15% 바로 환급해 드려요" }]
    signals:
      - { signal_id: S3, quote: "재택 부업 관심 있으시면 연락 주세요", explanation: "처음 메시지에는 업무가 적혀 있지 않았습니다." }
      - { signal_id: H3, quote: "쇼핑몰 상품을 대신 구매해 주시면 원금+수익 15% 바로 환급해 드려요", explanation: "지원자 돈으로 대신 구매하게 하는 구매대행 사기 수법입니다." }
      - { signal_id: H4, quote: "먼저 체크카드 앞면 사진 보내 주세요", explanation: "채용 전에 금융정보를 요구합니다." }
    axis_violations:
      - { axis: A, quote: "먼저 체크카드 앞면 사진 보내 주세요", explanation: "일하기 전에 금융정보가 먼저 나갑니다." }

