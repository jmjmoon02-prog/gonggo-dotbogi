# 개발 전용 고정 추출값 — AI 대신 사람이 손으로 적은 '추출 결과'
# - 로컬에서 DEV_FIXTURES=1 일 때만, 샘플 문장을 고치지 않고 판정할 때만 쓴다. 배포 화면에서는 쓰지 않는다.
# - 용도: AI 연결 전 화면 흐름 확인, 규칙 엔진 회귀 시험.
# - 빠진 필드는 core/samples.py 가 기본값(없음·false·빈 목록)으로 채운다.
# - 인용(quote)은 마스킹된 원문에 있는 문장이어야 한다(메신저 ID 등은 [메신저ID1] 같은 토큰으로 바뀐다).
demo_platform_normal:
  round1:
    company: { name: "가상제빵", name_quote: "가상제빵 망원점", region: "망원" }
    job: { title: "주말 매장 스태프", duties_summary: "빵 진열, 계산, 매장 정리", duty_clarity: clear, work_location: "망원점" }
    pay: { amount_text: "시급 11,000원", unit: hour, amount_krw: 11000, hours_per_unit: 1, quote: "시급 11,000원, 주휴수당 별도" }
    contact: { channels: [platform_message], quote: "지원 방법: 플랫폼 '지원하기' 버튼" }
    value_flow:
      worker_receives: [{ item: "시급 11,000원 + 주휴수당", quote: "시급 11,000원, 주휴수당 별도" }]
      required_actions: [{ item: "매장 업무", quote: "빵 진열, 계산, 매장 정리" }]
      hiring_process: "플랫폼 지원, 근로계약서 작성"

demo_telegram_cash:
  round1:
    job: { title: "심부름", duties_summary: "받은 현금을 지정 장소에 전달", duty_clarity: vague }
    pay: { amount_text: "일당 30만 원", unit: day, amount_krw: 300000, same_day_pay: true, quote: "고액 알바 당일 지급🔥 일당 30만 원" }
    contact: { channels: [telegram], moves_to_messenger: true, quote: "텔레그램 @[메신저ID1] 로 연락 주세요" }
    value_flow:
      passes_through_worker: [{ item: "고객 현금", quote: "고객님께 받은 현금을 지정 장소에 전달하는 간단한 심부름" }]
      required_actions: [{ item: "현금 전달", quote: "지정 장소에 전달하는 간단한 심부름" }]
      hiring_process: "텔레그램 연락"
    signals:
      - { signal_id: H2, quote: "고객님께 받은 현금을 지정 장소에 전달하는 간단한 심부름", explanation: "제3자에게 받은 현금을 전달하는 업무로, 보이스피싱 수거책 모집 수법과 같습니다." }
      - { signal_id: S1, quote: "고액 알바 당일 지급", explanation: "업무 설명 없이 고액·당일 지급을 강조합니다." }
      - { signal_id: S2, quote: "자세한 건 텔레그램 @[메신저ID1] 로 연락 주세요", explanation: "텔레그램으로 이동을 유도합니다." }
    axis_violations:
      - { axis: B, quote: "고객님께 받은 현금을 지정 장소에 전달", explanation: "근로자가 남의 돈이 지나가는 통로가 됩니다." }
    missing_info: ["업체명·사업자등록번호", "근로계약서 작성 여부"]

demo_brand_review:
  round1:
