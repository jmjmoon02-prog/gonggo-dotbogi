meta:
  version: 1
  created: "2026-11-23"
  purpose: "외부 확인셋 — 테스트셋(직접 작성)과 출처가 다른 공식 자료의 공고 문구로 규칙·AI 를 점검 (합성 테스트셋의 순환 위험 보완)"
  rule: "공식 자료가 사기 공고 예시로 직접 인용한 문구만, 바꾸거나 덧붙이지 않고 그대로 쓴다(여러 문구는 줄바꿈으로만 잇는다). 설명 문장(수법 설명)은 쓰지 않는다."
  limits: "원문 인용 예시가 있는 공식 자료가 적어 4건뿐이다. rules.yaml 예시 표현 일부가 같은 자료에서 왔으므로 키워드 기준선에는 유리하다."
  groups:
    X1: { class: scam, name: "해외 취업사기 문구 (E60)", evidence_ids: [E60] }
    X2: { class: scam, name: "스팸문자 전송 알바 문구 (E63)", evidence_ids: [E63] }
    X3: { class: scam, name: "성매매 의심 구인광고 예시 (E66)", evidence_ids: [E66] }
    X4: { class: scam, name: "리뷰 체험단 사기 첫 메시지 (E59)", evidence_ids: [E59] }

items:
  - id: X1-1
    group: X1
    class: scam
    source_channel: sns_messenger
    text: |
      비자 없이 리조트 알바 가능
      한 달에 1,000만 원 벌 수 있다
    expected_grade: red
    acceptable_grades: [red, yellow]
    expected_rules: [H7]
    source: "KTV [클릭K+] 무자격 고수익 보장?! 해외 취업 사기 주의보, 정책브리핑 2025-11-19"
    url: "https://www.korea.kr/news/policyNewsView.do?newsId=148954930"
    license: "공공누리 제4유형(출처표시·상업적 이용금지·변경금지) — 문구를 바꾸지 않고 사용"

  - id: X2-1
    group: X2
    class: scam
    source_channel: sns_messenger
    text: |
      문자알바 주급 5만원
      친구 섭외 시 추가 5천원
    expected_grade: red
    acceptable_grades: [red]
    expected_rules: [H6]
    source: "방송통신위원회 카드뉴스 '청소년 노리는 스팸문자 전송 아르바이트 주의', 정책브리핑 2021-10-26"
    url: "https://www.korea.kr/news/cardnewsView.do?newsId=148894762"
    license: "공공누리 표시 없음 — 짧은 인용(출처 표시)으로만 사용"

  - id: X3-1
    group: X3
    class: scam
    source_channel: community
    text: |
      일급 50만원, 20-35세 여성 모집, 월급 7백만원 이상 가능
    expected_grade: yellow
    acceptable_grades: [yellow, red]
    expected_rules: [M5]
    source: "고용노동부 설명자료 '문제가 된 구인·구직사이트에 즉시 시정조치', 정책브리핑 2023-02-15 (예시 문구)"
    url: "https://www.korea.kr/briefing/actuallyView.do?newsId=148911719"
    license: "공공누리 제1유형(출처표시)"

  - id: X4-1
    group: X4
    class: scam
    source_channel: sms
    text: |
      리뷰 체험단 모집합니다
    expected_grade: white
    acceptable_grades: [white, yellow, orange, red]
    expected_rules: []
    note: "단계형 사기의 첫 메시지. 문구만으로는 정보가 부족해 ⚪ 확인 필요 + 레드플래그 질문이 의도한 동작"
    source: "경찰청 카드뉴스 '\"리뷰 체험단 모집합니다\" 신종 피싱사기 주의…예방법은?', 정책브리핑 2024-04-23"
    url: "https://www.korea.kr/multi/visualNewsView.do?newsId=148928265"
    license: "공공누리 제4유형(출처표시·상업적 이용금지·변경금지) — 문구를 바꾸지 않고 사용"
