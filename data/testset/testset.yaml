      가입할 때 휴대폰 본인인증이 필요하고, 인증번호는 담당자에게 전달해 주세요.
    expected_grade: red
    acceptable_grades: [red]
    expected_rules: [H1, M1]
    note: "인증번호 제공 요구"

  - id: G3-3
