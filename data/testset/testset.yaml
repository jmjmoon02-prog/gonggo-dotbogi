  # ===================================================================== 사기 시나리오
  - id: G1-1
    group: G1
    class: scam
    source_channel: sns_messenger
    text: |
      [재택부업] 쇼핑몰 구매대행 알바 모집
      상품을 먼저 대신 구매해 주시면 원금+수익 15%를 30분 안에 돌려드립니다.
      하루 1시간, 휴대폰만 있으면 가능
      문의는 텔레그램 @buyhelper_job
    expected_grade: red
    acceptable_grades: [red]
    expected_rules: [H3]
    note: "대신 구매 후 원금+수익 환급"

  - id: G1-2
    group: G1
    class: scam
    source_channel: community
    text: |
      팀 미션 부업 같이 하실 분~ 첫 미션은 무료 체험으로 1만 원 바로 지급해 드리고,
      다음 단계부터는 미션 금액을 입금하고 진행하면 수익이 두 배예요. 오픈채팅으로 오세요
    expected_grade: red
    acceptable_grades: [red]
    expected_rules: [H3]
    note: "소액 정산으로 신뢰를 쌓은 뒤 입금 요구"

  - id: G1-3
    group: G1
    class: scam
    source_channel: sms
    text: |
      [부업안내] 앱 리뷰 작성만 하면 건당 3천원! 포인트 충.전 후 미션 시작,
      충전금은 당일 전액 환급됩니다. 상담: 카톡 ID reviewjob24
    expected_grade: red
    acceptable_grades: [red]
    expected_rules: [H3]
    note: "변형 표기 '충.전'"

  - id: G2-1
    group: G2
    class: scam
    source_channel: sms
    text: |
      [국내 1위 오픈마켓 공식 협력] 상품 리뷰 체험단 모집
      하루 20분 리뷰 작성, 건당 1만5천 원.
      참여 신청은 카카오톡 친구 추가 후 안내드립니다.
    expected_grade: orange
    acceptable_grades: [orange, red]
    expected_rules: [I1]
    note: "브랜드 내세움 + 공식 연결 없음 + 개인 메신저"

  - id: G2-2
    group: G2
    class: scam
    source_channel: sns_messenger
    text: |
      유명 배달앱 본사 마케팅팀입니다. 매장 리뷰 알바 모집 중이에요.
      아래 링크에서 회원가입하시면 포인트 5천 원 바로 지급! http://review-point.example
    expected_grade: orange
    acceptable_grades: [orange, red]
    expected_rules: [I1, M1]
    note: "브랜드 사칭 + 외부 사이트 가입 유도"

  - id: G2-3
    group: G2
    class: scam
    source_channel: sms
    text: |
      [대형 쇼핑몰 체험단] 당첨을 축하드립니다! 상품 구매 후 리뷰를 남기시면
      구매금액+수수료 20%를 환급해 드립니다. 먼저 지정 계좌로 상품 금액을 입금해 주세요.
    expected_grade: red
    acceptable_grades: [red, orange]
    expected_rules: [H3, I1]
    note: "사칭 + 선입금 → 결정적 신호 우선"

  - id: G3-1
    group: G3
