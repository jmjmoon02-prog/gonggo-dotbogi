# 화면에 보여 주는 원칙 4줄
principles:
  - { text: "일하기 전에 내 돈이 먼저 나가면 사기다", evidence_ids: [E57, E58] }
  - { text: "내 통장·카드·명의를 남이 쓰게 하면 범죄에 가담하게 된다", evidence_ids: [E56, E65] }
  - { text: "모르는 돈·물건을 옮기는 일은 범죄일 수 있다", evidence_ids: [E61, E65] }
  # 넷째 줄은 E60 원문 인용이 아니라 E60 사례에서 도출한 설계 원칙
  - { text: "여권·휴대폰을 맡기라는 요구는 거절한다", evidence_ids: [E60], evidence_note: "E60 사례(여권·휴대전화 압수·감금)에서 도출한 설계 원칙" }

# 국세청 조회 결과에 따른 확인 질문 (휴업·미등록은 결정적 신호가 아니라 확인 필요)
fact_questions:
  nts_suspended: "국세청 조회에서 휴업 상태로 나옵니다. 지금 영업 중인 사업장인지, 근무할 곳의 사업자등록번호가 맞는지 알려 주실 수 있나요?"
  nts_not_registered: "알려 주신 사업자등록번호가 국세청에서 조회되지 않습니다. 번호를 다시 확인해 주실 수 있나요?"
  checksum_invalid: "사업자등록번호 형식이 맞지 않습니다. 정확한 번호를 다시 알려 주실 수 있나요?"

# 업체 확인이 안 될 때 기본으로 묻는 질문 (첫 메시지는 무해한 단계형 사기에 대비한 레드플래그 유도형)
# 순서 = 화면에 보이는 순서. 위험 신호를 드러내는 질문을 먼저 둔다.
general_questions:
  - "업무를 하면서 제 돈이 들어가는 일(충전·구매·교육비·보증금 등)이 있나요?"
  - "제 통장·체크카드·신분증 사본이나 인증번호를 회사에 보내야 하나요?"
  - "받은 돈이나 물건을 다른 사람이나 다른 계좌로 보내야 하나요?"
  - "회사 상호와 사업자등록번호를 알려 주실 수 있나요?"
  - "근로계약서를 쓰나요? 급여는 언제, 어떤 방식(계좌 이체·현금)으로 받나요?"

rules:
  # ------------------------------------------------------------------ 결정적 H
  - id: H1
    tier: H
    axis: B
    detection: ai
    name: "자금 경유 (계좌·카드·인증번호 제공, 받은 돈 이체·환전 후 전달)"
    description: "본인 계좌·체크카드·OTP·인증번호를 넘기거나 빌려주게 하는 일, 본인 계좌로 받은 돈을 다른 곳으로 이체·송금·환전하거나 상품권·가상자산을 사서 넘기게 하는 일, 택배로 받은 타인 카드로 현금을 인출하게 하는 일."
    examples:
      - "통장 대여 시 월 OO만 원"
      - "체크카드를 보내 주시면 됩니다"
      - "OTP나 인증번호만 알려 주세요"
      - "입금된 금액을 지정 계좌로 이체"
      - "해외송금 대행 / 환전 업무"
      - "정산 업무, 수금, 채권 회수 대행"
      - "상품권 구매 후 핀번호 전달"
      - "코인 구매 대행"
      - "택배로 받은 카드로 인출"
    check_question: "받은 돈을 다른 계좌로 보내거나 상품권·코인으로 바꿔 전달하는 일이 있나요? 제 통장·카드·인증번호를 회사에 넘겨야 하나요?"
    guidance: "통장·카드·인증번호는 어떤 이유로도 넘기지 마세요. 내 계좌로 받은 남의 돈을 옮기는 일은 보이스피싱 피해금을 옮기는 통로로 쓰일 수 있습니다(E56, E65)."
    legal_note: "통장·체크카드를 넘기거나 빌려주면 최대 징역 5년 또는 벌금 3천만 원에 처해질 수 있습니다(E56). 받은 돈을 옮기는 단순 가담도 대가·반복 여부에 따라 엄중 처벌되는 추세입니다(E65)."
    report_to: [police, fss]
    evidence_ids: [E56, E64, E65]
    version: "2.0.0"
    status: active

  - id: H2
    tier: H
    axis: B
    detection: ai
    name: "현금·물품 수거·전달·보관·운반"
    description: "고객이나 제3자에게 현금을 받아 전달하게 하거나, 내용물을 알 수 없는 물건을 받아 옮기거나 보관하게 하는 일."
    examples:
      - "고객님께 받은 현금을 전달"
      - "현금 수거 / 수금 심부름"
      - "서류·물건 전달 심부름, 건당 고액"
      - "물품 보관만 해 주시면 됩니다"
      - "짐 옮기기, 내용물은 확인하지 마세요"
    check_question: "현금이나 물건을 받아서 다른 사람에게 전달하거나 보관하는 일인가요? 물건이라면 내용물이 무엇인가요?"
    guidance: "모르는 돈·물건을 옮기는 일은 거절하세요."
    legal_note: "현금을 받아 전달하는 일은 보이스피싱 수거책 가담이 될 수 있고 단순 가담도 엄중 처벌되는 추세입니다(E65). 내용물을 모르는 물건 운반은 마약운반책 모집일 확률이 높고, 응하면 10년 이하 유기징역에 처해질 수 있습니다(E61)."
    report_to: [police]
    evidence_ids: [E25, E61, E65]
    version: "2.0.0"
    status: active

  - id: H3
    tier: H
    axis: A
    detection: ai
    name: "지원자 돈 투입 (선입금·충전·대신 구매·수수료·차량 구매·대출)"
