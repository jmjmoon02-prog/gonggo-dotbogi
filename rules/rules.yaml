# 판정 규칙 데이터 — 공고돋보기
# 판정 규칙 v2 + 신종 수법 대응 원칙 6축. 모든 근거는 아래 evidence 에 출처와 URL 을 적었다(E번호는 근거 ID).
# 판정 엔진(core/rules_engine.py)은 이 파일을 읽기만 한다. 규칙 추가·수정에 코드 수정이 필요 없도록 한다.
# 학습 고리: 새 규칙은 status: candidate 로 들어오고, 사람이 공식 근거(evidence_ids)를 붙여 승인해야 active 가 된다.
#
# tier 뜻
#   H 결정적(하나라도 → 🔴)  M 중간(🟡 이상)  I 사칭(🟠)  S 약한 신호(2개 이상 → 🟡)
#   T 신뢰 신호(🟢 조건)     X 이상 신호(판정기 조종 문장, 🟡 이상)  L 근로조건 위법 가능(사기 판정과 분리 표시)
# detection 뜻
#   ai   = AI 추출 단계가 근거 문장을 인용해 후보로 낸다(인용 검증 실패 시 한 단계 강등)
#   code = 코드가 추출 필드·공공 API 결과·입력 채널로 계산한다

meta:
  version: "2.1.0"
  updated: "2026-11-23"
  source: "판정 규칙 v2(공식 자료로 확인한 취업사기·범죄가담 수법 12유형 대입 후 확정, 2026-11-23) + 신종 수법 대응 원칙 6축"
  changelog:
    - "2.1.0: 내부 검토 반영 — 🔴 표시명 '위험 신호 발견', H8 은 폐업만(휴업·미등록은 확인 필요), 112 근거 E61, 원칙 D 문구·근거 표기 정정"
    - "2.0.0: 판정 규칙 v2 최초 데이터화"

grades:
  red:    { emoji: "🔴", label: "위험 신호 발견" }  # 업체를 단정하지 않고 신호를 안내
  orange: { emoji: "🟠", label: "사칭 의심" }
  yellow: { emoji: "🟡", label: "주의" }
  white:  { emoji: "⚪", label: "확인 필요" }
  green:  { emoji: "🟢", label: "낮은 위험(확인 권장)" }

thresholds:
  weak_signals_for_yellow: 2       # 약한 신호 2개 이상 → 🟡
  max_weak_signals_for_green: 1    # 🟢 은 약한 신호 1개 이하일 때만
  # 임시값(근거 약함, 테스트셋으로 조정): E66 예시 '월 700만 원'은 2026 최저임금 월 환산(2,156,880원)의 약 3.2배,
  # '일급 50만 원'은 일 8시간 환산 약 6.1배. 시급 환산액이 최저임금의 이 배수 이상이면 S4.
  excessive_pay_ratio: 3.0

# 근거 ID → 출처·URL (화면 근거 링크). 모두 원문을 직접 확인한 자료.
